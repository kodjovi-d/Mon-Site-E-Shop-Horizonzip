kind = "web"
previewPath = "/"
title = "E-Shop Horizon"
version = "1.0.0"
id = "artifacts/eshop-horizon"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22277

[services.development]
run = "pnpm --filter @workspace/eshop-horizon run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/eshop-horizon", "run", "build" ]
publicDir = "artifacts/eshop-horizon/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22277"
BASE_PATH = "/"
